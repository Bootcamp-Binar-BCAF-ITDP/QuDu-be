name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests and the coverage gate
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify -Dtest='!LoanApplicationTests'

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      # Download and open index.html to see which lines are untested.
      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

      - name: Coverage summary
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          [ -f "$CSV" ] || exit 0
          awk -F, 'NR>1 { im+=$4; ic+=$5; bm+=$6; bc+=$7 }
                   END {
                     printf "| Counter | Covered | Total | %% |\n"
                     printf "|---|---|---|---|\n"
                     printf "| Instructions | %d | %d | %.1f%% |\n", ic, ic+im, (ic+im) ? 100*ic/(ic+im) : 0
                     printf "| Branches | %d | %d | %.1f%% |\n", bc, bc+bm, (bc+bm) ? 100*bc/(bc+bm) : 0
                   }' "$CSV" >> "$GITHUB_STEP_SUMMARY"
