name: Deploy GCP

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Rollback: tag of an image already in GHCR (first 12 characters of the commit SHA). Leave empty to build this commit.'
        required: false
        type: string

concurrency:
  group: deploy-gcp
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  DEPLOY_DIR: /opt/qudu-be

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event.inputs.image_tag == ''

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests and the coverage gate
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify -Dtest='!LoanApplicationTests'

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: meta
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to GCP VM
    runs-on: ubuntu-latest
    needs: image
    if: always() && (needs.image.result == 'success' || github.event.inputs.image_tag != '')

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image
        id: rel
        env:
          ROLLBACK_TAG: ${{ github.event.inputs.image_tag }}
          BUILT_IMAGE: ${{ needs.image.outputs.image }}
        run: |
          if [ -n "$ROLLBACK_TAG" ]; then
            if [[ ! "$ROLLBACK_TAG" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error::image_tag must be a hexadecimal commit SHA, not '$ROLLBACK_TAG'."
              exit 1
            fi
            image="ghcr.io/${GITHUB_REPOSITORY,,}:$ROLLBACK_TAG"
            echo "Rolling back to $image"
          else
            image="$BUILT_IMAGE"
            echo "Deploying $image"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Build .env from GitHub Secrets
        env:
          GCP_HOST: ${{ secrets.GCP_HOST }}
          GCP_USER: ${{ secrets.GCP_USER }}
          GCP_SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
          GCP_KNOWN_HOSTS: ${{ secrets.GCP_KNOWN_HOSTS }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}

          APP_PORT: ${{ vars.APP_PORT || '127.0.0.1:8080' }}
          CORS_ALLOWED_ORIGIN: ${{ vars.CORS_ALLOWED_ORIGIN || 'https://quick-duit.profilku.site' }}
          FRONTEND_RESET_PASSWORD_URL: ${{ vars.FRONTEND_RESET_PASSWORD_URL || 'https://quick-duit.profilku.site/reset-password/{token}' }}
          JWT_TTL_MINUTES: ${{ vars.JWT_TTL_MINUTES || '30' }}
          REFRESH_TTL_DAYS: ${{ vars.REFRESH_TTL_DAYS || '7' }}
          MAIL_HOST: ${{ vars.MAIL_HOST || 'smtp.gmail.com' }}
          MAIL_PORT: ${{ vars.MAIL_PORT || '587' }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          API_DOCS_ENABLED: ${{ vars.API_DOCS_ENABLED || 'true' }}
        run: |
          missing=""
          for name in GCP_HOST GCP_USER GCP_SSH_KEY GCP_KNOWN_HOSTS \
                      DB_USERNAME DB_PASSWORD JWT_SECRET MAIL_USERNAME MAIL_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            echo "Set them in Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

          if [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "::error::JWT_SECRET must be at least 32 characters. Generate one with: openssl rand -hex 32"
            exit 1
          fi

          if [[ "$FRONTEND_RESET_PASSWORD_URL" != *"/{token}"* ]]; then
            echo "::error::FRONTEND_RESET_PASSWORD_URL must contain {token} as a path segment, e.g. https://domain/reset-password/{token}"
            exit 1
          fi

          MAIL_FROM="${MAIL_FROM:-$MAIL_USERNAME}"
          if [ -n "$FIREBASE_CREDENTIALS_JSON" ]; then FIREBASE_ENABLED=true; else FIREBASE_ENABLED=false; fi

          keys="DB_USERNAME DB_PASSWORD JWT_SECRET JWT_TTL_MINUTES REFRESH_TTL_DAYS
                CORS_ALLOWED_ORIGIN FRONTEND_RESET_PASSWORD_URL
                MAIL_HOST MAIL_PORT MAIL_USERNAME MAIL_PASSWORD MAIL_FROM
                APP_PORT API_DOCS_ENABLED FIREBASE_ENABLED"

          nl=$'\n'
          for k in $keys; do
            v="${!k}"
            if [[ "$v" == *"'"* || "$v" == *"$nl"* ]]; then
              echo "::error::The value of $k contains a single quote or a newline. Change the value."
              exit 1
            fi
          done

          umask 077
          mkdir -p .deploy
          {
            for k in $keys; do printf "%s='%s'\n" "$k" "${!k}"; done
            echo "FIREBASE_CREDENTIALS_PATH='file:/app/secrets/firebase-credentials.json'"
          } > .deploy/.env

          if [ "$FIREBASE_ENABLED" = true ]; then
            printf '%s\n' "$FIREBASE_CREDENTIALS_JSON" > .deploy/firebase-credentials.json
            jq empty .deploy/firebase-credentials.json \
              || { echo "::error::FIREBASE_CREDENTIALS_JSON is not valid JSON."; exit 1; }
          fi

          echo "Configuration ready: $(echo $keys | wc -w) keys, Firebase=$FIREBASE_ENABLED, APP_PORT=$APP_PORT"

      - name: Set up SSH
        env:
          GCP_SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
          GCP_KNOWN_HOSTS: ${{ secrets.GCP_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$GCP_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$GCP_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::GCP_SSH_KEY could not be read as an OpenSSH private key."
            if grep -q 'PuTTY-User-Key-File' ~/.ssh/deploy_key; then
              echo "The stored key is in PuTTY (.ppk) format. OpenSSH format is required."
            elif grep -q '^ssh-' ~/.ssh/deploy_key; then
              echo "The stored key is a PUBLIC key. Its private counterpart is required."
            else
              echo "The first line must be '-----BEGIN OPENSSH PRIVATE KEY-----'. Copy the whole key again."
            fi
            exit 1
          fi

          cat > ~/.ssh/config <<EOF
          Host vm
            HostName ${{ secrets.GCP_HOST }}
            User ${{ secrets.GCP_USER }}
            IdentityFile ~/.ssh/deploy_key
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
          EOF

          ssh vm 'echo "Connected to $(hostname) as $(id -un)"'

      - name: Upload deploy files
        run: |
          ssh vm "set -e
            if [ ! -w '$DEPLOY_DIR' ]; then
              sudo -n mkdir -p '$DEPLOY_DIR'
              sudo -n chown \"\$(id -un):\" '$DEPLOY_DIR'
            fi
            mkdir -p '$DEPLOY_DIR/scripts'"

          scp -q docker-compose.yml docker-compose.gcp.yml "vm:$DEPLOY_DIR/"
          scp -q scripts/gcp-deploy.sh scripts/install-docker-debian.sh "vm:$DEPLOY_DIR/scripts/"

          scp -q .deploy/.env "vm:$DEPLOY_DIR/.env.upload"
          ssh vm "chmod 600 '$DEPLOY_DIR/.env.upload' && mv '$DEPLOY_DIR/.env.upload' '$DEPLOY_DIR/.env'"

          if [ -f .deploy/firebase-credentials.json ]; then
            scp -q .deploy/firebase-credentials.json "vm:$DEPLOY_DIR/.firebase-credentials.upload"
            ssh vm "chmod 600 '$DEPLOY_DIR/.firebase-credentials.upload'"
          fi

      - name: Run deploy on VM
        id: deploy
        env:
          IMAGE: ${{ steps.rel.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_EMPTY_DB: ${{ vars.ALLOW_EMPTY_DB || 'false' }}
        run: |
          set -o pipefail
          printf '%s\n' "$GHCR_TOKEN" | ssh vm \
            "ALLOW_EMPTY_DB='$ALLOW_EMPTY_DB' bash '$DEPLOY_DIR/scripts/gcp-deploy.sh' '$IMAGE' '${{ github.actor }}'" \
            | tee .deploy/deploy.log

          echo "tunnel_url=$(sed -n 's/^PUBLIC_URL=//p' .deploy/deploy.log | tail -1)" >> "$GITHUB_OUTPUT"
          echo "tunnel_mode=$(sed -n 's/^TUNNEL_MODE=//p' .deploy/deploy.log | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Verify from the public internet
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://api-gcp.profilku.site' }}
        run: |
          base="${PUBLIC_BASE_URL:-$TUNNEL_URL}"
          if [ -z "$base" ] && [ "$TUNNEL_MODE" = "quick" ]; then
            echo "::error::The Cloudflare tunnel is running but did not report a URL. See the 'Cloudflare Tunnel' section in the previous step's log."
            exit 1
          fi
          if [ -z "$base" ]; then
            case "$APP_PORT" in
              80) base="http://$GCP_HOST" ;;
              *[!0-9]*) echo "APP_PORT=$APP_PORT is not public and PUBLIC_BASE_URL is empty; skipping the external check."; exit 0 ;;
              *) base="http://$GCP_HOST:$APP_PORT" ;;
            esac
          fi
          url="${base%/}/api/plafonds/catalog"

          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url") || true
            if [ "$code" = "200" ]; then
              echo "$url answered 200."
              exit 0
            fi
            sleep 3
          done
          if [ -n "$TUNNEL_URL$PUBLIC_BASE_URL" ]; then
            echo "::error::Healthy inside the VM but $url is unreachable (code $code). Check the 'Cloudflare Tunnel' section in the previous step's log. A new trycloudflare URL sometimes needs a few more seconds; try Re-run."
          else
            echo "::error::Healthy inside the VM but $url is unreachable from outside (code $code). Code 000 means port $APP_PORT is closed in the GCP firewall. Turn the tunnel back on (delete the CLOUDFLARE_TUNNEL variable or set it to 'on')."
          fi
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.rel.outputs.image }}\` |"
            echo "| Commit | \`${GITHUB_SHA::12}\` |"
            echo "| Tunnel | ${{ steps.deploy.outputs.tunnel_mode || '-' }} |"
            echo "| Public URL | ${{ vars.PUBLIC_BASE_URL || steps.deploy.outputs.tunnel_url || '-' }} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove key and configuration
        if: always()
        run: rm -rf ~/.ssh/deploy_key .deploy
