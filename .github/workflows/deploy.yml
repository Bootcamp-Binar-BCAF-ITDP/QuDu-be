name: Deploy AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Rollback: tag of an image already in GHCR (first 12 characters of the commit SHA). Leave empty to build this commit.'
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  DEPLOY_DIR: /opt/qudu-be
  PUBLIC_URL: https://api.profilku.site/api/plafonds/catalog

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event.inputs.image_tag == ''

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests and the coverage gate
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify -Dtest='!LoanApplicationTests'

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-aws
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: meta
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: image
    if: always() && (needs.image.result == 'success' || github.event.inputs.image_tag != '')

    environment: production

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets are set
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing deploy secrets:$missing"
            echo "Set them in Settings > Secrets and variables > Actions. This job runs in the"
            echo "'production' environment; repository secrets are read as well."
            exit 1
          fi

      - name: Resolve image
        id: rel
        env:
          ROLLBACK_TAG: ${{ github.event.inputs.image_tag }}
          BUILT_IMAGE: ${{ needs.image.outputs.image }}
        run: |
          if [ -n "$ROLLBACK_TAG" ]; then
            if [[ ! "$ROLLBACK_TAG" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error::image_tag must be a hexadecimal commit SHA, not '$ROLLBACK_TAG'."
              exit 1
            fi
            image="ghcr.io/${GITHUB_REPOSITORY,,}:$ROLLBACK_TAG"
            echo "Rolling back to $image"
          else
            image="$BUILT_IMAGE"
            echo "Deploying $image"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::EC2_SSH_KEY could not be read as an OpenSSH private key."
            if grep -q 'PuTTY-User-Key-File' ~/.ssh/deploy_key; then
              echo "The stored key is in PuTTY (.ppk) format. OpenSSH format is required."
            elif grep -q '^ssh-' ~/.ssh/deploy_key; then
              echo "The stored key is a PUBLIC key. Its private counterpart is required."
            elif [ "$(head -n 1 ~/.ssh/deploy_key)" != "-----BEGIN OPENSSH PRIVATE KEY-----" ]; then
              echo "The first line must be '-----BEGIN OPENSSH PRIVATE KEY-----'."
            else
              echo "The header is correct but the body was truncated or corrupted while copying. Copy the whole key again."
            fi
            exit 1
          fi

          {
            echo "Host server"
            echo "  HostName $EC2_HOST"
            echo "  User $EC2_USER"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 20"
            echo "  ServerAliveInterval 15"
          } > ~/.ssh/config

          ssh server 'echo "Connected to $(hostname) as $(id -un)"'

      - name: Upload deploy files
        run: |
          ssh server "set -e
            if [ ! -w '$DEPLOY_DIR' ]; then
              sudo -n mkdir -p '$DEPLOY_DIR'
              sudo -n chown \"\$(id -un):\" '$DEPLOY_DIR'
            fi
            mkdir -p '$DEPLOY_DIR/scripts'"

          scp -q docker-compose.yml docker-compose.aws.yml "server:$DEPLOY_DIR/"
          scp -q scripts/aws-deploy.sh "server:$DEPLOY_DIR/scripts/"

      - name: Run deploy on EC2
        env:
          IMAGE: ${{ steps.rel.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh server \
            "bash '$DEPLOY_DIR/scripts/aws-deploy.sh' '$IMAGE' '${{ github.actor }}'"

      - name: Verify from the public internet
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PUBLIC_URL") || true
            if [ "$code" = "200" ]; then
              echo "$PUBLIC_URL answered 200."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Healthy on the server but $PUBLIC_URL is unreachable (code $code). Check nginx (sudo nginx -t) or the security group for port 443."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.rel.outputs.image }}\` |"
            echo "| Commit | \`${GITHUB_SHA::12}\` |"
            echo "| URL | $PUBLIC_URL |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
