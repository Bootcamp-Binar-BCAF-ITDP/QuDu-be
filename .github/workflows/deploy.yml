name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to deploy, for rolling back. Leave empty to build this commit.'
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    if: github.event.inputs.image_tag == ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # LoanApplicationTests is the generated @SpringBootTest context loader and
      # needs a real Postgres. Everything else is plain Mockito.
      #
      # verify rather than test, because that is the phase the JaCoCo gate runs
      # in: a drop in coverage blocks the deploy for the same reason a failing
      # test does.
      - run: ./mvnw -B verify -Dtest='!LoanApplicationTests'

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    if: github.event.inputs.image_tag == ''

    permissions:
      contents: read
      packages: write

    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      repo: ${{ steps.meta.outputs.repo }}

    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: always() && (needs.build.result == 'success' || github.event.inputs.image_tag != '')

    permissions:
      contents: read
      packages: read

    environment: production

    steps:
      - name: Work out which image to deploy
        id: target
        run: |
          REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          TAG='${{ github.event.inputs.image_tag }}'
          if [ -z "$TAG" ]; then TAG='${{ needs.build.outputs.tag }}'; fi

          echo "image=${{ env.REGISTRY }}/$REPO:$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying ${{ env.REGISTRY }}/$REPO:$TAG"

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/qudu-be' }}
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "APP_DIR='$APP_DIR' IMAGE='$IMAGE' REGISTRY='$REGISTRY' \
             REGISTRY_USER='$REGISTRY_USER' REGISTRY_TOKEN='$REGISTRY_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"

          # The workflow's own token, valid only while this run lasts. No long
          # lived registry credential is left sitting on the instance.
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          trap 'docker logout "$REGISTRY" >/dev/null 2>&1 || true' EXIT

          # Read from the running container, not from the compose file. The
          # compose file only says which image was asked for; this says which
          # one is actually serving, and that is what a rollback must return to.
          RUNNING=$(docker compose ps -q app 2>/dev/null || true)
          PREVIOUS=""
          if [ -n "$RUNNING" ]; then
            PREVIOUS=$(docker inspect --format '{{.Config.Image}}' "$RUNNING" 2>/dev/null || true)
          fi
          echo "Currently serving: ${PREVIOUS:-nothing}"

          docker pull "$IMAGE"
          APP_IMAGE="$IMAGE" docker compose up -d

          echo "Waiting for the new container to report healthy..."
          for _ in $(seq 1 30); do
            CID=$(docker compose ps -q app 2>/dev/null || true)
            STATUS=$(docker inspect --format '{{.State.Health.Status}}' "$CID" 2>/dev/null || echo starting)

            if [ "$STATUS" = "healthy" ]; then
              echo "Healthy. Deploy complete."
              docker image prune -f --filter 'until=168h' >/dev/null 2>&1 || true
              exit 0
            fi
            [ "$STATUS" = "unhealthy" ] && break
            sleep 10
          done

          echo "::error::The new image never became healthy."
          docker compose logs --tail 100 app || true

          if [ -n "$PREVIOUS" ]; then
            echo "Rolling back to $PREVIOUS"
            APP_IMAGE="$PREVIOUS" docker compose up -d
          else
            echo "Nothing was running before this, so there is nothing to roll back to."
          fi

          exit 1
          REMOTE

      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
