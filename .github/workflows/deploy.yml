name: Deploy AWS

# Setiap push ke main yang lolos test tayang ke EC2 (https://api.profilku.site),
# dijalankan dengan Docker sejak 2026-09-19:
#
#   test  ->  image (dibangun di runner, di-push ke GHCR)  ->  deploy (EC2 menarik image)
#
# EC2 tidak pernah mem-build apa pun. Workflow ini mengunggah docker-compose.yml,
# docker-compose.aws.yml, dan scripts/aws-deploy.sh ke /opt/qudu-be, lalu skrip
# itu yang bekerja: tarik image, nyalakan PostgreSQL di container, tukar
# container aplikasi, rollback kalau gagal. nginx + certbot tetap di host dan
# meneruskan ke 127.0.0.1:8080.
#
# Konfigurasi (.env) MILIK SERVER, tidak dikirim dari GitHub: dibuat sekali dari
# /etc/qudu-be.env saat migrasi, dan diedit langsung di /opt/qudu-be/.env.
# Karena itu workflow ini hanya butuh empat secret EC2_*.
#
# Target lain (VM GCP) ada di deploy-gcp.yml. Panduan: DEPLOY.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Rollback: tag image yang sudah ada di GHCR (12 karakter awal SHA commit). Kosongkan untuk membangun commit ini.'
        required: false
        type: string

# Satu deploy pada satu waktu, dan jangan membatalkan yang sedang jalan:
# pertukaran container yang terpotong meninggalkan server setengah jadi.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  DEPLOY_DIR: /opt/qudu-be
  PUBLIC_URL: https://api.profilku.site/api/plafonds/catalog

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.event.inputs.image_tag == ''

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # verify, bukan package: gerbang coverage JaCoCo ikut menghentikan deploy.
      # LoanApplicationTests butuh PostgreSQL sungguhan, jadi dilewati.
      # chmod: git di Windows tidak merekam bit executable.
      - name: Test dan gerbang coverage
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify -Dtest='!LoanApplicationTests'

      - name: Laporan test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-aws
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  image:
    name: Bangun dan push image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      # Nama image di GHCR wajib huruf kecil; nama repo org ini tidak.
      - name: Tentukan nama image
        id: meta
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image yang sama persis dengan yang dibangun deploy-gcp.yml untuk commit
      # ini (tag = SHA). .dockerignore mengeluarkan application.properties dan
      # kredensial Firebase, jadi image tidak membawa secret apa pun.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Tayangkan ke EC2
    runs-on: ubuntu-latest
    needs: image
    if: always() && (needs.image.result == 'success' || github.event.inputs.image_tag != '')

    environment: production

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      # Tanpa ini, secret yang belum diisi baru ketahuan saat ssh dipanggil
      # dengan tujuan "@" dan yang muncul hanyalah layar bantuan ssh, exit 255.
      - name: Pastikan secret deploy sudah terisi
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in EC2_HOST EC2_USER EC2_SSH_KEY EC2_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Secret deploy belum terisi:$missing"
            echo "Isi di Settings > Secrets and variables > Actions. Job ini berjalan di"
            echo "environment 'production'; repository secret juga terbaca."
            exit 1
          fi

      - name: Tentukan image
        id: rel
        env:
          ROLLBACK_TAG: ${{ github.event.inputs.image_tag }}
          BUILT_IMAGE: ${{ needs.image.outputs.image }}
        run: |
          if [ -n "$ROLLBACK_TAG" ]; then
            if [[ ! "$ROLLBACK_TAG" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "::error::image_tag harus SHA commit (heksadesimal), bukan '$ROLLBACK_TAG'."
              exit 1
            fi
            image="ghcr.io/${GITHUB_REPOSITORY,,}:$ROLLBACK_TAG"
            echo "Rollback ke $image"
          else
            image="$BUILT_IMAGE"
            echo "Deploy $image"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # tr -d '\r': kunci yang disalin dari Windows membawa CRLF, dan OpenSSH
      # menolaknya dengan "error in libcrypto" yang tidak menyebut sebabnya.
      # Secret dibaca lewat env, tidak pernah disisipkan ke skrip.
      - name: Siapkan SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::EC2_SSH_KEY tidak terbaca sebagai kunci privat OpenSSH."
            if grep -q 'PuTTY-User-Key-File' ~/.ssh/deploy_key; then
              echo "Yang tersimpan format PuTTY (.ppk). Dibutuhkan format OpenSSH."
            elif grep -q '^ssh-' ~/.ssh/deploy_key; then
              echo "Yang tersimpan kunci PUBLIK. Dibutuhkan pasangan privatnya."
            elif [ "$(head -n 1 ~/.ssh/deploy_key)" != "-----BEGIN OPENSSH PRIVATE KEY-----" ]; then
              echo "Baris pertama harus '-----BEGIN OPENSSH PRIVATE KEY-----'."
            else
              echo "Kepala benar tapi isinya terpotong atau rusak saat disalin. Salin ulang utuh."
            fi
            exit 1
          fi

          {
            echo "Host server"
            echo "  HostName $EC2_HOST"
            echo "  User $EC2_USER"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 20"
            echo "  ServerAliveInterval 15"
          } > ~/.ssh/config

          ssh server 'echo "Terhubung ke $(hostname) sebagai $(id -un)"'

      - name: Unggah berkas deploy
        run: |
          ssh server "set -e
            if [ ! -w '$DEPLOY_DIR' ]; then
              sudo -n mkdir -p '$DEPLOY_DIR'
              sudo -n chown \"\$(id -un):\" '$DEPLOY_DIR'
            fi
            mkdir -p '$DEPLOY_DIR/scripts'"

          scp -q docker-compose.yml docker-compose.aws.yml "server:$DEPLOY_DIR/"
          scp -q scripts/aws-deploy.sh "server:$DEPLOY_DIR/scripts/"

      # Token GHCR lewat stdin, bukan argumen, agar tidak terlihat di `ps`.
      - name: Jalankan deploy di EC2
        env:
          IMAGE: ${{ steps.rel.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh server \
            "bash '$DEPLOY_DIR/scripts/aws-deploy.sh' '$IMAGE' '${{ github.actor }}'"

      - name: Buktikan dari internet publik
        run: |
          for i in $(seq 1 10); do
            # curl mencetak 000 sendiri saat gagal terhubung.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PUBLIC_URL") || true
            if [ "$code" = "200" ]; then
              echo "$PUBLIC_URL menjawab 200."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Sehat di server tetapi $PUBLIC_URL tidak terjangkau (kode $code). Periksa nginx (sudo nginx -t) atau security group port 443."
          exit 1

      - name: Ringkasan
        if: always()
        run: |
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${{ steps.rel.outputs.image }}\` |"
            echo "| Commit | \`${GITHUB_SHA::12}\` |"
            echo "| URL | $PUBLIC_URL |"
            echo "| Hasil | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hapus kunci deploy
        if: always()
        run: rm -f ~/.ssh/deploy_key
