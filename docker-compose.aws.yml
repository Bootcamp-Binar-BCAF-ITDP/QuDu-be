services:
  db:
    image: postgres:18-alpine
    container_name: qudu-be-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: qudu2
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d qudu2"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: qudu-be-redis
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  app:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CACHE_TYPE: redis
      REDIS_HOST: redis
      DB_URL: jdbc:postgresql://db:5432/qudu2

volumes:
  pgdata:
