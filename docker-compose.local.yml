services:
  db:
    image: postgres:18-alpine
    container_name: qudu-be-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-qudu2}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set in .env.local}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.local}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: qudu-be-redis
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

  app:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-qudu2}
      REDIS_HOST: redis
      CACHE_TYPE: redis

volumes:
  pgdata:
