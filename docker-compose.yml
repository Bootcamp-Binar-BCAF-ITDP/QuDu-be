name: qudu-be

services:
  app:
    image: ${APP_IMAGE:-qudu-be:local}
    build:
      context: .
    container_name: qudu-be
    restart: unless-stopped

    env_file:
      - ${ENV_FILE:-.env}

    environment:
      UPLOAD_ROOT: /app/uploads

    ports:
      - "${APP_PORT:-8080}:8080"

    volumes:
      - uploads:/app/uploads
      - ./secrets:/app/secrets:ro

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/plafonds/catalog > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uploads:
