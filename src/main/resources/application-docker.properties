spring.application.name=loan
spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.security.cors-allowed-origin=${CORS_ALLOWED_ORIGIN}

app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-ttl-minutes=${JWT_TTL_MINUTES:15}
app.security.refresh-ttl-days=${REFRESH_TTL_DAYS:7}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM}

app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL}
app.firebase.enabled=${FIREBASE_ENABLED:false}
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}

loan.documents.storage-path=${UPLOAD_ROOT:/app/uploads}/loan-documents
customer.documents.storage-path=${UPLOAD_ROOT:/app/uploads}/customer-documents

logging.level.org.springframework.web=INFO

# API documentation. On by default because the whole point is that the team can
# read it, but it publishes the shape of every endpoint to anyone who can reach
# the port. Set API_DOCS_ENABLED=false once this faces the public internet, or
# put it behind the reverse proxy with the rest.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

# Groups are ordered by the config class, not alphabetically, so the dropdown
# reads Public first and Superadmin last.
springdoc.swagger-ui.groups-order=asc
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.disable-swagger-default-url=true
